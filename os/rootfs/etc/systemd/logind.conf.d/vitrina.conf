# La tecla de encendido no apaga de golpe: Vitrina pregunta qué hacer.
# Dejarla presionada unos segundos sí apaga (por si la app no responde).
# Al cerrar la tapa, la Mac se pone en reposo y al abrirla sigue donde se quedó.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
IdleAction=ignore
