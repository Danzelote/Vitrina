# Sin protector de pantalla ni apagado automático: de eso se encarga Vitrina.
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection

# Trackpad de Mac: tocar para hacer clic y desplazamiento natural con dos dedos.
Section "InputClass"
    Identifier "vitrina-touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "NaturalScrolling" "true"
EndSection
