# Copiar cada cuadro a la pantalla en vez de intercambiar pantallas (page flip).
# Con las GeForce viejas (nouveau, nv50), cada intercambio deja al núcleo
# esperando el refresco de la pantalla sin dormir: ~1 % de procesador por cuadro.
# La copia la hace la tarjeta de video y casi no cuesta.
Section "Device"
    Identifier "vitrina-graficos"
    Driver     "modesetting"
    Option     "PageFlip" "off"
EndSection
