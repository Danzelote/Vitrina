# Sin menú: en algunas Macs (con NVIDIA) el menú queda invisible y espera para siempre.
set timeout=0
set timeout_style=hidden
search --no-floppy --set=root --file /live/vitrina.id
linux /live/vmlinuz boot=live quiet loglevel=3 vt.global_cursor_default=0 systemd.show_status=0
initrd /live/initrd.img
boot
