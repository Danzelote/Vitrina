# Vitrina instalada: el kernel y la configuración están en la partición de
# arranque (FAT, que cualquier GRUB lee), en /EFI/vitrina. Los deja install.sh.
insmod part_gpt
insmod fat
if search --no-floppy --set=root --file /EFI/vitrina/grub.cfg; then
    configfile ($root)/EFI/vitrina/grub.cfg
else
    echo "Vitrina: no se encontró el disco instalado."
    sleep 30
fi
